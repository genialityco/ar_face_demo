<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Filter GPGPU</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        color: white;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #container {
        position: relative;
        width: min(var(--camera-size, 480px), 90vw);
      }
      video {
        display: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        max-height: 80vh;
        border-radius: 12px;
      }
      #brand-logo {
        position: fixed;
        top: 16px;
        right: 16px;
        height: 36px;
        width: auto;
        z-index: 10;
      }
      #filter-controls {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: rgba(20, 20, 20, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        backdrop-filter: blur(6px);
        z-index: 10;
      }
      #filter-description {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(480px, 80vw);
        padding: 6px 14px;
        background: rgba(20, 20, 20, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        backdrop-filter: blur(6px);
        color: rgba(255, 255, 255, 0.75);
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        z-index: 10;
      }
      #filter-controls label {
        font-size: 14px;
        opacity: 0.8;
      }
      #filter-controls select {
        background: #1a1a1a;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 14px;
      }
      #filter-controls select:disabled {
        opacity: 0.5;
      }
      #filter-controls button {
        background: #1a1a1a;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 4px 9px;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      #filter-controls #mirror-label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 14px;
        opacity: 0.85;
        cursor: pointer;
        user-select: none;
      }
      /* Espejo global de la cámara (invierte todo lo que dibuja el renderer) */
      #container.mirrored canvas {
        transform: scaleX(-1);
      }
      #filter-controls button:hover {
        background: #2a2a2a;
      }
      /* En pantalla completa la cámara ocupa todo el viewport (la UI queda encima) */
      :fullscreen #container,
      :-webkit-full-screen #container {
        width: 100vw;
        height: 100vh;
      }
      :fullscreen canvas,
      :-webkit-full-screen canvas {
        width: 100%;
        height: 100%;
        max-height: none;
        object-fit: contain;
        border-radius: 0;
      }
      /* Modo "fondo completo": la cámara llena la ventana del navegador sin usar
         la Fullscreen API (la barra del navegador sigue visible; la UI va encima) */
      #container.page-full {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }
      #container.page-full canvas {
        width: 100%;
        height: 100%;
        max-height: none;
        border-radius: 0;
        object-fit: cover;
      }
      #filter-status {
        font-size: 12px;
        opacity: 0.7;
        min-width: 90px;
      }
      #message-overlay {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        padding: 16px 28px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        color: white;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.4s ease, transform 0.4s ease;
        pointer-events: none;
      }
      #message-overlay.message-overlay-visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      #debug-panel {
        display: none;
        align-items: center;
        gap: 10px;
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 6px 12px;
        background: rgba(20, 20, 20, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        color: #0f0;
        font-family: monospace;
        font-size: 13px;
        z-index: 15;
      }
      #debug-mood-toggle-label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img id="brand-logo" src="/LOGOS_GEN.iality_web-02.svg" alt="Logo" />
    <div id="app">
      <div id="container"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
